name: Publish isolated Aetheron wallet preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout certified source commit
        uses: actions/checkout@v4
        with:
          repository: MastaTrill/Aetheron_platform
          ref: c6c7cb4bf2fe1358e42ed1638365bd82999e84d5
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Verify built dashboard link and target document
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const home = fs.readFileSync('dist/index.html', 'utf8');
          const dashboard = fs.readFileSync('dist/dashboard-enhanced.html', 'utf8');
          assert.match(home, /href="dashboard-enhanced\.html" class="footer-social" aria-label="Open dashboard"/);
          assert.doesNotMatch(home, /href="dashboard\.html"/);
          assert.match(dashboard, /<!doctype html>/i);
          assert.match(dashboard, /<title[^>]*>[^<]+<\/title>/i);
          console.log('Isolated dashboard footer links to a complete dashboard document');
          const probe = fs.readFileSync('dist/qa-network-switch.html', 'utf8');
          const probeScript = fs.readFileSync('dist/qa-network-switch.js', 'utf8');
          assert.match(probe, /noindex, nofollow/);
          assert.match(probe, /Restore Base Mainnet/);
          assert.match(probeScript, /wallet_switchEthereumChain/);
          assert.doesNotMatch(probeScript, /eth_sendTransaction|personal_sign|eth_signTypedData|wallet_sendCalls/);
          console.log('Isolated network probe published without signing or transaction methods');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload isolated preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
